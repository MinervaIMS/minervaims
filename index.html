      =================================================================
      GOOGLE SEARCH CONSOLE VERIFICATION SLOT.
      -----------------------------------------------------------------
      Uncomment the line below and paste the token Search Console gives
      you, then redeploy and press Verify. Nothing else has to change.

      IT HAS TO LIVE HERE, IN THE STATIC HTML, AND NOT IN A COMPONENT.
      Google's verification check fetches the page and reads the markup;
      unlike Googlebot proper it does not execute JavaScript, so a tag
      rendered by React would never be seen and verification would fail
      with the tag apparently present in the browser. That is the usual
      reason this method fails on a single-page application.

      DO NOT ADD data-rh="true" TO IT. That attribute marks a tag as
      owned by react-helmet-async, which removes any such tag it does not
      itself re-emit on every navigation. The verification tag must
      survive, so it stays unmarked, and Helmet leaves it alone.

      A DNS TXT record is the better method where it is available: it
      verifies the whole domain rather than one URL prefix, it covers
      www and non-www and http and https at once, and it cannot be
      undone by a deploy. Use this tag only if DNS is not reachable.
      =================================================================
    -->

    <!--
      apple-mobile-web-app-status-bar-style is deliberately NOT set.
      "black-translucent" paints the status bar black on the very first
      frame, before any script runs, which is what made the workspace open
      with a black bar and only turn purple after a manual reload.
    -->
    <script>
      // Browser chrome, decided BEFORE the first paint.
      // ---------------------------------------------------------------
      // React mounts too late to colour the status bar: WebKit has already
      // committed whatever the document declared. This runs in <head>, so
      // the first frame is right and a reload behaves like a cold open.
      // RouteChrome keeps it in step afterwards, using the same rules.
      (function () {
        try {
          var path = location.pathname || '/';
          // Both addresses: /workspace is where it lives, /admin is the
          // redirect, and the purple band must be right on the very first
          // frame of either.
          var workspace = path.indexOf('/workspace') === 0 || path.indexOf('/admin') === 0;
          var root = document.documentElement;
          root.setAttribute('data-route', workspace ? 'workspace' : 'public');
          // The purple band over the top safe area is painted by CSS from
          // this attribute, so the area reads purple from frame one.
          var ua = navigator.userAgent || '';
          var ios = /iPad|iPhone|iPod/.test(ua) ||
            (ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1);
          var tag = document.querySelector('meta[name="theme-color"]');
          if (ios) {
            // One declared colour tints BOTH of Safari's bars. Removing it
            // lets Safari sample each edge instead, which is the only way
            // to get a purple top and a light bottom at the same time.
            if (tag) tag.parentNode.removeChild(tag);
          } else if (tag) {
            tag.setAttribute('content', workspace ? '#1F0F4D' : '#000000');
          }
        } catch (e) { /* chrome colour is cosmetic: never block the app */ }
      })();
    </script>

    <!--
      ===================================================================
      THE PAGE, FOR A READER THAT DOES NOT RUN JAVASCRIPT.
      -------------------------------------------------------------------
      This site is a single-page React application: without JavaScript the
      document is an empty <div id="root">. Google renders JavaScript and
      sees the real pages, but most of the crawlers that now matter for
      being FOUND THROUGH AN ASSISTANT do not: GPTBot, ClaudeBot,
      PerplexityBot, Applebot-Extended and the rest fetch the HTML and
      read what is in it. Until now what was in it was nothing at all, so
      a model asked "what is Minerva IMS and how do I join" had only the
      one-line description in <head> to work from.

      What follows is therefore a real summary and a real link graph: the
      facts a reader would want, and an anchor to every public page so
      that a crawler can walk the site rather than dead-ending here. It is
      invisible to every visitor with JavaScript enabled, which is all of
      them, so it costs the interface nothing.

      It is deliberately short and factual. It is a signpost to the pages,
      not a copy of them, and llms.txt carries the fuller account.
      ===================================================================
    -->
    <noscript>
      <h1>Minerva Investment Management Society</h1>
      <p>
        Minerva Investment Management Society (MIMS) is a student association of
        Universita Bocconi in Milan, founded in 2017 and dedicated to investment
        research and portfolio management. It is run entirely by students, publishes
        research reports, manages student portfolios, and holds events with industry
        professionals and its alumni.
      </p>
      <h2>Research divisions</h2>
      <ul>
        <li><a href="/divisions/equity">Equity Research</a>: single-name coverage across sectors, with full financial modelling, discounted cash flow and relative valuation, target prices and published reports.</li>
        <li><a href="/divisions/investment">Investment Research</a>: cross-asset strategy, global outlooks and trade ideas across equities, rates, credit, FX and commodities.</li>
        <li><a href="/divisions/macro">Macro Research</a>: thematic reports on monetary policy, growth and fiscal sustainability, and structural shifts in the international economy.</li>
        <li><a href="/divisions/portfolio">Portfolio Management</a>: designs, runs and reports on the society's student-managed portfolios, with disclosed holdings.</li>
        <li><a href="/divisions/quant">Quantitative Research</a>: models for risk, forecasting and derivatives pricing, built with probability, statistical inference, optimisation and machine learning.</li>
      </ul>
      <h2>Student-managed funds</h2>
      <ul>
        <li><a href="/funds/multi-asset">Multi Asset Global Opportunities Fund</a>, actively managed across equities, bonds and commodities.</li>
        <li><a href="/funds/long-short">Long Short Equity Fund</a>, market-neutral, driven by a proprietary multi-factor model.</li>
        <li><a href="/funds/dps">Diversified Passive Selection Fund</a> (closed), an ETF-only allocation.</li>
        <li><a href="/funds/pir">Italian Equity PIR Fund</a> (closed), Italian equities within the PIR framework.</li>
      </ul>
      <h2>Joining the association</h2>
      <p>
        Minerva IMS recruits once each academic semester, and applications are open
        to Bocconi students. Applicants name a first choice of division and, for the
        research divisions, a second; they submit a CV and a written answer to the
        question set by their first-choice division. Shortlisted candidates are
        invited to interview by the division that selected them, and successful
        candidates receive an offer to join with a role and a division.
        <a href="/join">Recruiting and admissions</a> explains the process in full and
        answers the questions applicants ask most often, and the
        <a href="/apply">application form</a> is where an application is submitted.
      </p>
